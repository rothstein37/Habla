mc('g01','A2','grammar','Ayer ___ al supermercado.',['voy','fui','iba','iré'],'fui','Ayer מציין זמן עבר שהסתיים; fui היא צורת העבר של ir בגוף ראשון.');
mc('g02','A2','grammar','Cuando era niño, ___ al fútbol todos los días.',['jugué','jugaré','jugaba','juego'],'jugaba','פעולה שהייתה הרגל בעבר: imperfecto.');

mc('g04','A2','grammar','¿___ está la estación?',['Qué','Dónde','Cuándo','Cuál'],'Dónde','Dónde שואל על מקום; qué שואל מה.');

mc('g06','A2','grammar','El café ___ muy caliente ahora.',['es','está','son','tiene'],'está','estar מתאר מצב נוכחי.');
mc('g07','A2','grammar','Este regalo es ___ mi madre.',['por','para','de','en'],'para','para מבטא יעד או מקבל.');

mc('g12','B1','grammar','Espero que ___ una buena semana.',['tienes','tuviste','tengas','tendrás'],'tengas','esperar que + subjuntivo כאשר מביעים תקווה.');

mc('g14','B1','grammar','Llevo dos años ___ español.',['estudio','estudiado','estudiar','estudiando'],'estudiando','llevar + período + gerundio מבטא משך פעולה נמשכת.');
mc('g15','B1','grammar','No sé cuánto cuesta. Aunque ___ caro, lo compraré.',['es','sea','son','era'],'sea','כאשר המחיר מוצג כאפשרות לא ודאית, aunque + subjuntivo.');
mc('g16','A1','grammar','Yo ___ de Israel.',['eres','soy','son','es'],'soy','ser בגוף ראשון יחיד: soy.');

mc('v02','A2','vocab','¿Qué necesitas para pagar sin efectivo?',['una tarjeta','un billete','una maleta','un recibo'],'una tarjeta','tarjeta היא כרטיס; efectivo הוא מזומן.');
mc('v03','A2','vocab','El tren sale con retraso. ¿Qué significa retraso?',['עיכוב','רציף','מהירות','החלפה'],'עיכוב','retraso = עיכוב או איחור.');
mc('v04','A2','vocab','¿Cuál es un sinónimo de «barato»?',['económico','lejano','rápido','difícil'],'económico','barato/económico = זול.');
mc('v05','A2','vocab','¿Qué pides al terminar de comer en un restaurante?',['la cuenta','la entrada','la esquina','la llave'],'la cuenta','la cuenta הוא החשבון לתשלום.');
mc('v06','B1','vocab','«Me da igual» significa…',['זה לא משנה לי','זה דחוף','זה משמח אותי','זה בלתי אפשרי'],'זה לא משנה לי','me da igual = אין לי העדפה / זה לא משנה לי.');
mc('v07','B1','vocab','Si alguien dice «vale la pena», quiere decir que…',['כדאי','זה יקר מדי','זה מסוכן','זה מאוחר'],'כדאי','valer la pena = להיות שווה את המאמץ.');
mc('v08','B1','vocab','«Aprovechar el tiempo» significa…',['לנצל את הזמן','לבזבז זמן','לדחות פגישה','לשנות שעה'],'לנצל את הזמן','aprovechar = לנצל לטובה.');
mc('v09','A1','vocab','¿Cuál es una bebida?',['agua','pan','mesa','calle'],'agua','agua = מים.');
mc('l01','A2','listening','מתי יוצא האוטובוס?',['בשמונה','בתשע וחצי','בעשר','בשבע וחצי'],'בתשע וחצי','El autobús sale a las nueve y media.','El autobús sale a las nueve y media. Llega al centro a las diez.');
mc('l02','A2','listening','למה הדוברת לא תגיע לארוחת הערב?',['כי היא עובדת','כי היא חולה','כי היא נוסעת','כי שכחה'],'כי היא עובדת','Tengo que trabajar hasta tarde = אני צריכה לעבוד עד מאוחר.','Lo siento, no puedo ir a cenar esta noche. Tengo que trabajar hasta tarde.');
mc('l03','A2','listening','מה קנה הדובר?',['חולצה כחולה','נעליים שחורות','מעיל ירוק','מכנסיים לבנים'],'חולצה כחולה','camisa azul = חולצה כחולה.','Ayer fui de compras y compré una camisa azul. No encontré los zapatos que quería.');
mc('l04','A2','listening','איפה בית המרקחת?',['מול הבנק','ליד התחנה','בתוך הקניון','מאחורי המסעדה'],'מול הבנק','enfrente del banco = מול הבנק.','La farmacia está enfrente del banco. Sigue todo recto y cruza la calle.');
mc('l05','B1','listening','מדוע הוחלט לשנות את התוכנית?',['בגלל מזג האוויר','בגלל המחיר','בגלל פקק','בגלל שעות העבודה'],'בגלל מזג האוויר','Como va a llover = מכיוון שצפוי גשם.','Íbamos a pasar el día en la playa, pero como va a llover, hemos decidido visitar un museo.');

function pickQuestion(p){
 const pool=BANK.filter(q=>q.level===p.level&&(lesson.topic==='auto'||q.topic===lesson.topic));
 const history=new Set([...(p.seen||[]),...p.attempts.map(a=>a.qid)]),used=new Set(lesson.used.map(q=>q.id));
 const lastById=new Map(p.attempts.map(a=>[a.qid,a])),possible=lesson.topic==='auto'?lesson.focus:[lesson.topic];
 const mode=lesson.topic==='numbers'?numberMode:'mixed';
 let nextNumbers=null,repeatNumbers=null;
 if(possible.includes('numbers')){nextNumbers=newNumber(p.level,mode,[...new Set([...history,...used])]);if(!nextNumbers)repeatNumbers=newNumber(p.level,mode,[...used]);}
 const byTopic=Object.fromEntries(possible.map(t=>[t,t==='numbers'?(nextNumbers?[nextNumbers]:[]):pool.filter(q=>q.topic===t&&!used.has(q.id)&&!history.has(q.id))]));
 let available=possible.filter(t=>byTopic[t].length);
 if(!available.length){
   possible.forEach(t=>{byTopic[t]=t==='numbers'?(repeatNumbers?[repeatNumbers]:[]):pool.filter(q=>q.topic===t&&!used.has(q.id));});
   available=possible.filter(t=>byTopic[t].length);
 }
 if(!available.length)return null;
 const prev=lesson.used.at(-1)?.topic;
 if(available.length>1)available=available.filter(t=>t!==prev);
 const weight=t=>lesson.duration===30&&['speaking','writing'].includes(t)?1.75:1;
 const rank=t=>lesson.used.filter(q=>q.topic===t).length/weight(t);
 const best=Math.min(...available.map(rank)),topic=sample(available.filter(t=>rank(t)===best));
 let candidates=byTopic[topic];if(topic==='numbers')return candidates[0];
 if(candidates.every(q=>history.has(q.id))){
   const older=candidates.filter(q=>!p.attempts.slice(-12).some(a=>a.qid===q.id));if(older.length)candidates=older;
   const wrong=candidates.filter(q=>['incorrect','accent'].includes(lastById.get(q.id)?.result));if(wrong.length)candidates=wrong;
 }
 if(lesson.duration===5){const short=candidates.filter(q=>!q.free);if(short.length)candidates=short;}
 if(lesson.duration===30&&['speaking','writing'].includes(topic)&&Math.random()<.35){const open=candidates.filter(q=>q.free);if(open.length)candidates=open;}
 return sample(candidates);
}
function start(topic){
 const p=profile();if(!p)return;const recent=p.attempts.slice(-30),counts=t=>recent.filter(a=>a.topic===t).length;

 if(topic==='auto'&&duration===5)focus=focus.sort((a,b)=>counts(a)-counts(b)).slice(0,2);
 const now=Date.now();lesson={id:uid(),profileId:p.id,topic,focus,start:now,deadline:now+duration*60000,duration,used:[],attempts:[],q:null,feedback:null,chosen:null,finished:false,expired:false};

}

}
function timeStr(ms){let sec=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}

function evaluate(q,answer){let a=normalize(answer);let model=q.model||q.answers[0]||'';if(q.free)return {result:'review',heading:'השווה את התשובה שלך לדוגמה',detail:'תשובה חופשית אינה מקבלת ציון אוטומטי בגרסה זו. השתמש בנקודות הבדיקה ובתשובת המודל.',model,check:q.check||[]};if(q.answers.some(x=>normalize(x)===a))return {result:'correct',heading:'¡Muy bien! נכון',detail:q.why,model};if(q.numeric!==undefined&&q.type==='speak'&&Number(a.replace(/\s/g,''))===q.numeric)return {result:'correct',heading:'המספר זוהה נכון',detail:'מנוע התמלול החזיר את המספר כספרות. אין כאן הערכת הגייה. '+q.why,model};if(q.type==='write'&&q.answers.some(x=>bare(x)===bare(answer)))return {result:'accent',heading:'כמעט — שים לב לאיות ולהטעמה',detail:'המילים תואמות, אך האיות כולל הבדל בהטעמה או בסימן דיאקריטי. '+q.why,model};if(q.type==='mc'||q.topic==='numbers'||(q.topic==='grammar'&&q.prompt.startsWith('השלם רק את הפועל:')))return {result:'incorrect',heading:'לא בדיוק — הנה ההסבר',detail:q.why,model};let hints=(q.rules||[]).filter(([pat])=>bare(answer).includes(bare(pat))).map(x=>x[1]);return {result:'review',heading:'ניסוח אחר — בדיקה עצמית',detail:(hints.length?hints.join(' ')+' ':'')+q.why+' ייתכן שהתשובה שלך תקינה בניסוח אחר; אין ציון ללא אימות.',model};}
function submitAnswer(){if(!lesson||lesson.finished||lesson.feedback)return;if(Date.now()>=lesson.deadline){finish(true);return;}let q=lesson.q,answer=q.type==='mc'?lesson.chosen:$('answer')?.value?.trim();if(!answer){$('answerError').textContent='בחר או הקלד תשובה לפני הבדיקה.';return;}let result=evaluate(q,answer),p=profile(),today=new Date().toDateString(),already=p.attempts.some(a=>a.qid===q.id&&new Date(a.at).toDateString()===today),points=already?0:result.result==='correct'?10:result.result==='accent'?5:0;let attempt={id:uid(),sessionId:lesson.id,qid:q.id,topic:q.topic,level:q.level,prompt:q.prompt,answer,model:result.model,result:result.result,points,at:new Date().toISOString()};p.attempts.push(attempt);lesson.attempts.push(attempt);lesson.feedback={...result,answer,points};save();render();}

function finish(completed,reason='time'){if(!lesson||lesson.finished)return;stopAudio();clearInterval(interval);lesson.finished=true;lesson.reason=completed?reason:'manual';let p=db.profiles.find(x=>x.id===lesson.profileId);if(p&&lesson.attempts.length&&!p.sessions.some(s=>s.id===lesson.id)){p.sessions.push({id:lesson.id,topic:lesson.topic,at:new Date().toISOString(),duration:lesson.duration,elapsedSec:Math.min(Math.round((Date.now()-lesson.start)/1000),lesson.duration*60),completed:!!completed,attempts:lesson.attempts.length});save();}page='summary';render();}
function summary(){let a=lesson?.attempts||[],correct=a.filter(x=>x.result==='correct').length;return '<section class="hero"><div class="eyebrow">FIN DE LA SESIÓN</div><h1>¡Buen trabajo!</h1><p>'+ (lesson?.reason==='pool'?'כל תרגילי המאגר לנושא נוצלו בשיעור זה. ':lesson?.reason==='time'?'משך השיעור הסתיים. ':'השיעור הסתיים לפי בקשתך. ')+'התשובות שנבדקו נשמרו '+(storageOK?'בפרופיל המקומי שלך.':'רק בזיכרון הדף, כי האחסון חסום.')+'</p></section><div class="statgrid"><div class="stat"><strong>'+a.length+'</strong><span>תשובות שנבדקו</span></div><div class="stat"><strong>'+correct+'</strong><span>נכונות</span></div><div class="stat"><strong>+'+a.reduce((s,x)=>s+x.points,0)+'</strong><span>נקודות</span></div></div><p class="muted small">'+a.filter(x=>x.result==='review').length+' תשובות הועברו לבדיקה עצמית. הן לא נחשבות כטעויות.</p><button class="button full" data-page="home">חזרה לבית</button>';}
function play(slow=false){let q=lesson?.q;if(!q?.audio)return;let el=$('audioStatus');if(!('speechSynthesis'in window)){el.textContent='הקראה אינה נתמכת בדפדפן. ניתן לדלג על השאלה.';return;}let voices=speechSynthesis.getVoices(),es=voices.filter(v=>v.lang.toLowerCase().startsWith('es')),v=(!navigator.onLine?es.find(v=>v.localService):es.find(v=>v.localService)||es[0]);if(!v&&!navigator.onLine){el.textContent='אין קול ספרדי מקומי זמין. דלג או התחבר לאינטרנט.';return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(q.audio);u.lang=v?.lang||'es-ES';if(v)u.voice=v;u.rate=slow?.72:.95;u.onerror=()=>{if($('audioStatus'))$('audioStatus').textContent='השמעה נכשלה. אפשר לדלג ללא ניקוד.';};u.onend=()=>{if($('audioStatus'))$('audioStatus').textContent='אפשר להאזין שוב.';};el.textContent='משמיע…';speechSynthesis.speak(u);}
function record(){
 const el=$('speechStatus'),button=document.querySelector('[data-action="record"]'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!el)return;
 if(rec){try{rec.stop();el.textContent='מסיים תמלול…';}catch{rec=null;}return;}
 if(!window.isSecureContext){el.textContent='נדרש אתר HTTPS. פתח את Habla בכתובת האתר ולא מתוך תצוגת קובץ. אפשר להקליד או להשתמש במיקרופון שבמקלדת.';return;}
 if(!navigator.onLine){el.textContent='תמלול בדפדפן דורש חיבור לרשת בגרסה זו. אפשר להקליד, או להשתמש בהכתבה במקלדת אם היא זמינה.';return;}
 if(!SR){el.textContent='הדפדפן אינו מספק זיהוי דיבור. נסה Chrome באנדרואיד או Safari באייפון, או השתמש בהכתבה במקלדת.';return;}
 const session=lesson?.id,qid=lesson?.q?.id,current=()=>lesson?.id===session&&lesson?.q?.id===qid&&!lesson.finished&&!lesson.feedback;
 const messages={'not-allowed':'הגישה למיקרופון נחסמה. אפשר אותה בהגדרות האתר והדפדפן ונסה שוב.','service-not-allowed':'שירות התמלול נחסם בדפדפן. נסה דפדפן אחר או הכתבה במקלדת.','audio-capture':'המיקרופון אינו זמין. בדוק חיבור והרשאות.','network':'שירות התמלול לא הצליח להתחבר. בדוק את הרשת ונסה שוב.','no-speech':'לא זוהה דיבור. לחץ שוב ודבר בספרדית.','aborted':'התמלול הופסק. אפשר לנסות שוב.','language-not-supported':'זיהוי ספרדית אינו זמין במכשיר זה.'};
 let instance,hadResult=false,hadError=false;
 try{
   instance=new SR();rec=instance;instance.lang='es-ES';instance.interimResults=false;instance.continuous=false;instance.maxAlternatives=1;
   instance.onstart=()=>{if(current()){if(button)button.textContent='■ סיום דיבור';el.textContent='מקשיב… דבר בספרדית.';}};
   instance.onresult=e=>{if(!current())return;const transcript=Array.from(e.results||[]).slice(e.resultIndex||0).map(v=>v[0]?.transcript||'').join(' ').trim();if(transcript&&$('answer')){$('answer').value=transcript;hadResult=true;el.textContent='התמליל נקלט. אפשר לערוך אותו לפני הבדיקה.';}};
   instance.onerror=e=>{hadError=true;if(current())el.textContent=messages[e.error]||'זיהוי הדיבור נכשל. נסה שוב או הקלד.';if(rec===instance)rec=null;if(current()&&button)button.textContent='🎙 התחל תמלול';};
   instance.onend=()=>{if(rec===instance)rec=null;if(current()){if(button)button.textContent='🎙 התחל תמלול';if(!hadResult&&!hadError)el.textContent='התמלול הסתיים בלי תשובה. אפשר לנסות שוב.';}};
   el.textContent='מבקש גישה למיקרופון…';if(button)button.textContent='■ עצור';instance.start();
 }catch(e){if(rec===instance)rec=null;if(button)button.textContent='🎙 התחל תמלול';el.textContent='לא ניתן להתחיל תמלול ('+(e.name||'שגיאה')+'). בדוק את ההרשאות או השתמש במקלדת.';}
}
function submitProfileForm(){const error=$('profileError');if(!error)return;error.textContent='';try{createProfile($('name').value,$('level').value);page='home';render();}catch(err){error.textContent=err.message||'לא ניתן ליצור פרופיל. נסה שוב.';}}
function quickGuest(){try{let existing=db.profiles.find(p=>p.name==='אורח');if(existing){db.active=existing.id;save();}else{createProfile('אורח','A2');}page='home';render();}catch(err){const el=$('profileError');if(el)el.textContent=err.message;}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.page){navTo(d.page);return;}if(b.id==='profileButton'){navTo('profiles');return;}if(d.profile){db.active=d.profile;save();page='home';render();return;}if(d.duration){duration=+d.duration;render();return;}if(d.mode){numberMode=d.mode;render();return;}if(d.topic){start(d.topic);return;}if(d.start){start(d.start);return;}if(d.choice!==undefined&&!lesson.feedback){lesson.chosen=lesson.options[+d.choice];document.querySelectorAll('.choice').forEach((x,i)=>x.classList.toggle('selected',i===+d.choice));return;}switch(d.action){case 'create-profile':submitProfileForm();break;case 'guest':quickGuest();break;case 'check':submitAnswer();break;case 'next':stopAudio();nextQuestion();break;case 'skip':stopAudio();nextQuestion();break;case 'end':finish(false);break;case 'listen':play();break;case 'slow':play(true);break;case 'record':record();break;case 'refresh-app':if(page!=='lesson')location.reload();break;}});
document.addEventListener('submit',e=>{if(e.target.id==='profileForm'){e.preventDefault();submitProfileForm();}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='name'&&!e.isComposing){e.preventDefault();submitProfileForm();}});document.addEventListener('change',e=>{if(e.target.id==='changeLevel'&&LEVELS.includes(e.target.value)){profile().level=e.target.value;save();render();}});document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();navTo('home');});document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
async function checkVersion(){if(!navigator.onLine||!/^https?:$/.test(location.protocol))return;try{const r=await fetch('./version.json',{cache:'no-store'});if(!r.ok)return;const v=await r.json();updateAvailable=typeof v.version==='string'&&v.version!=='1.2.0';if($('updateNotice'))$('updateNotice').hidden=!updateAvailable||page==='lesson';}catch{}}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});}
window.addEventListener('online',checkVersion);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion();});render();checkVersion();
</script></body></html>
